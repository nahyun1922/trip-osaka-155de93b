# 구글 지도 「맛집」 목록을 3시간마다 확인해서, 바뀌었으면 사이트에 반영한다. (여행 끝나면 끌 것)
name: 맛집 목록 갱신
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_food.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "맛집 목록 자동 갱신" && git push)
